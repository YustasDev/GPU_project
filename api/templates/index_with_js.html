<!-- api/templates/index_with_js.html
     Real-Time версия дашборда (паттерн SPA): сервер отдаёт пустой каркас, а данные
     подтягивает сам JavaScript из эндпоинта /api/events каждые 3 секунды.
     Рендерится из api/main_api.py через GET /live. Сравните с серверной версией
     index.html (GET /), где карточки собирает Jinja2 на стороне сервера. -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  <!-- адаптив для мобильных -->
    <title>Smart Observer Dashboard</title>
    <!-- Bootstrap 5 через CDN — те же стили, что и в index.html -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }                                              /* мягкий серый фон, чтобы белые карточки выделялись */
        .event-card { transition: transform 0.2s; }                                      /* плавная анимация при наведении */
        .event-card:hover { transform: scale(1.02); box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .conf-badge { position: absolute; top: 10px; right: 10px; font-size: 1.1em; }   /* бейдж уверенности поверх картинки */
    </style>
</head>
<body>

<div class="container py-5">
    <h1 class="mb-4 text-center">👁️ Smart Observer Dashboard</h1>
    <p class="text-center text-muted">События обновляются в реальном времени (каждые 3 сек)</p>

    <!-- ПУСТАЯ СЕТКА: в отличие от index.html здесь нет серверного цикла Jinja (for ... endfor) —
         карточки вставит сюда JavaScript после ответа от /api/events. -->
    <div id="events-grid" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4 mt-3">
        <!-- Индикатор загрузки: виден только до первого успешного ответа сервера -->
        <div class="col-12 text-center text-muted" id="loading-spinner">
            <div class="spinner-border text-primary" role="status"></div>
            <p>Подключение к AI-серверу...</p>
        </div>
    </div>
</div>

<!-- ================= МАГИЯ JAVASCRIPT ================= -->
<script>
    // Экранирование текста перед вставкой в HTML — защита от XSS.
    // Jinja2 в index.html делает это автоматически; при "ручной" сборке HTML в JS — это наша забота.
    // Приём: кладём текст в textContent временного <div>, а читаем уже безопасный innerHTML.
    function escapeHtml(text) {
        const div = document.createElement('div');  // временный элемент, в страницу не вставляется
        div.textContent = text;                      // браузер сам экранирует < > & и кавычки
        return div.innerHTML;                        // возвращаем безопасную строку
    }

    // Форматирование даты в тот же вид "ГГГГ-ММ-ДД ЧЧ:ММ:СС", что и в Jinja-версии.
    // Время приходит из БД в UTC и хранится без смещения, поэтому показывается как есть
    function formatDate(dateString) {
        const d = new Date(dateString);
        return d.getFullYear() + "-" +
               String(d.getMonth() + 1).padStart(2, '0') + "-" +
               String(d.getDate()).padStart(2, '0') + " " +
               String(d.getHours()).padStart(2, '0') + ":" +
               String(d.getMinutes()).padStart(2, '0') + ":" +
               String(d.getSeconds()).padStart(2, '0');
    }

    // Главная функция: получает свежие события и перерисовывает сетку карточек.
    async function fetchEvents() {
        try {
            // 1. Запрос к нашему FastAPI-эндпоинту (тот же limit=20, что и в серверной версии)
            const response = await fetch('/api/events?limit=20');
            if (!response.ok) {                          // сервер ответил ошибкой (например, 500)?
                throw new Error('HTTP ' + response.status);
            }
            const events = await response.json();        // массив объектов события (см. схему EventOut)

            const grid = document.getElementById('events-grid');
            grid.innerHTML = '';                         // очищаем сетку (убираем старые карточки и спиннер)

            // 2. Если база пуста — показываем заглушку и выходим
            if (events.length === 0) {
                grid.innerHTML = '<div class="col-12 text-center mt-5"><h4 class="text-muted">Событий пока нет.</h4></div>';
                return;
            }

            // 3. Для каждого события из JSON собираем HTML-карточку
            events.forEach(event => {
                const confidence = (event.confidence * 100).toFixed(1);  // 0..1 → проценты, один знак
                const objectClass = escapeHtml(event.object_class);      // текстовые поля экранируем (см. escapeHtml)
                const bbox = escapeHtml(event.bounding_box);

                // image_path в БД может быть пустым (колонка nullable) — тогда просто не вставляем <img>.
                // Так мы не падаем на split() и не делаем некорректный пустой src="".
                let imgTag = '';
                if (event.image_path) {
                    const filename = event.image_path.split('/').pop();  // берём только имя файла из полного пути
                    imgTag = `<img src="/images/${filename}" class="card-img-top" alt="Скриншот" style="height: 250px; object-fit: cover;">`;
                }

                const cardHtml = `
                    <div class="col">
                        <div class="card h-100 event-card shadow-sm">
                            ${imgTag}
                            <span class="badge bg-success conf-badge">${confidence}%</span>
                            <div class="card-body">
                                <h5 class="card-title text-capitalize text-primary">${objectClass}</h5>
                                <p class="card-text text-muted small">
                                    🕒 ${formatDate(event.timestamp)}
                                </p>
                                <p class="card-text text-secondary" style="font-size: 0.85em;">
                                    BBox: ${bbox}
                                </p>
                            </div>
                        </div>
                    </div>
                `;
                grid.insertAdjacentHTML('beforeend', cardHtml);  // дописываем карточку в конец сетки
            });

        } catch (error) {
            // Сеть недоступна или сервер вернул ошибку — пишем в консоль, страницу не ломаем
            console.error("Ошибка при получении данных:", error);
        }
    }

    // 4. Первый вызов сразу при загрузке страницы
    fetchEvents();

    // 5. И дальше повторяем каждые 3000 мс (3 секунды) — это и есть "реальное время"
    setInterval(fetchEvents, 3000);
</script>
</body>
</html>
