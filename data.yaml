# path: Абсолютный путь к главной папке датасета. 
# Настоятельно рекомендуется использовать именно абсолютный путь (от корня диска)
# Для WSL/Linux это выглядит так:
path: /home/user/datasets/cow_dataset

# train и val: Папки с картинками (Относительно переменной path)
# YOLO сама поймет, что разметка лежит в соседней папке labels/train
train: images/train  
val: images/val      

# test: Папка для финального тестирования (Опционально, можно удалить)
test: images/test    

# ==========================================
# 2. СЛОВАРЬ КЛАССОВ (Classes)
# ==========================================

# nc: Number of Classes (Количество классов). У нас их два.
nc: 2
# names: Словарь классов. 
# ВАЖНО: Нумерация всегда начинается с нуля
names:
    0: cow        # 0 = корова
    1: person     # 1 = человек 
 
